name: waymax_rs

channels:
  - nvidia/label/cuda-12.8.1
  - conda-forge
  - nodefaults

dependencies:
  - python = 3.12
  - pip
  
  # cuda
  - cuda

  # notebooks
  - ipykernel
  - ipywidgets

  # waymax
  - numpy >= 1.20
  - matplotlib >= 3.7.1
  - dm-tree >= 0.1.8
  - immutabledict >= 2.2.3
  - pillow >= 9.4.0
  - mediapy >= 1.1.6
  - tqdm >= 4.65.0
  - absl-py >= 1.4.0

  # plotting
  - opencv

  # .mp4 support
  - imageio >= 2.34
  - imageio-ffmpeg

  # array logging
  - zarr >= 2.18

  # gemini
  - google-generativeai

  # testing
  - pytest
  - pytest-benchmark

  - pip:
    # waymax
    - jax[cuda12-local] >= 0.4.6
    - tensorflow[and-cuda] >= 2.11.0
    - chex >= 0.1.6
    - dm_env >= 1.6
    - flax >= 0.6.7
    - wandb>=0.16.6,<0.20
    - git+https://github.com/waymo-research/waymax.git@main#egg=waymo-waymax

    # diffusion
    - optax >= 0.2.4
    - orbax-checkpoint >= 0.5.0