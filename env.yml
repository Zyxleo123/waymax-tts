name: es

channels:
  - nvidia/label/cuda-12.8.1
  - conda-forge
  - nodefaults

dependencies:
  - python = 3.12
  - pip
  
  # cuda
  - cuda
  
  # logging
  - wandb

  # notebooks
  - ipykernel
  - ipywidgets

  # waymax
  - numpy >= 1.20
  - matplotlib >= 3.7.1
  - dm-tree >= 0.1.8
  - immutabledict >= 2.2.3
  - pillow >= 9.4.0
  - mediapy >= 1.1.6
  - tqdm >= 4.65.0
  - absl-py >= 1.4.0

  # plotting
  - opencv

  # .mp4 support
  - imageio >= 2.34
  - imageio-ffmpeg

  # array logging
  - zarr >= 2.18

  # gemini
  - google-generativeai

  - pip:
    # waymax
    - jax[cuda12-local] >= 0.4.6, <0.5.0  # for tfp compatibility
    - tensorflow[and-cuda] >= 2.11.0
    - chex >= 0.1.6
    - dm_env >= 1.6
    - flax >= 0.6.7
    - git+https://github.com/waymo-research/waymax.git@main#egg=waymo-waymax

    # diffusion
    - optax >= 0.2.4
    - distrax >= 0.1.5
    - orbax-checkpoint >= 0.5.0
    - einops >= 0.8.0
    - tensorflow-probability[jax] >= 0.25.0
    - tf-keras

    # torch (testing only)
    # - --extra-index-url https://download.pytorch.org/whl/cu128
    # - torch == 2.10.0+cu128
    # - pytest
    # - pytest-benchmark
